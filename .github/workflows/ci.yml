# CI — 빌드·테스트 게이트 재확인.
# 배포 차단의 실체는 package.json의 build 스크립트 자체다:
#   velite --strict → 콘텐츠 린트 → hex 린트 → stylelint → next build
# Vercel도 동일한 `npm run build`를 실행하므로, 린트 위반은 CI 여부와 무관하게
# 배포가 실패한다 (CP1 C1 반영, 2026-08-06). 이 워크플로는 PR·푸시 시점에
# 같은 게이트 + 타입체크 + 골든 테스트를 재확인하는 역할이다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (velite --strict + 콘텐츠·스타일 린트 + next build)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Golden tests
        run: npm run test
